# lamill.toml — per-site config consumed by lamill (portfolio/ops) and rankmill (content/audits).
# [content] = stable identity, authored by hand. [todo] = volatile work state.
# rankmill output lives in sites/<domain>/rankmill-output/, not here.

schema = "lamill-toml-v1"

[deploy]
platform = "cf-pages"
production_branch = "main"
custom_domains = [
    "mcpscan.app",
]

[index]
indexnow_key = "824fd8af4229dfd29c51c932176aa663"
indexnow_enabled = true

[stack]
framework = "astro"

# Tracked todos for mcpscan.app. status: "done" | "open".
[[todo]]
status = "open"
priority = "medium"
task = "Check SEO: GSC indexation + coverage (revisit ~2026-07-18)"

[[todo]]
status = "open"
priority = "medium"
